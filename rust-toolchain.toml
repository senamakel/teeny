[toolchain]
# Pinned to the same toolchain as vendor/openhuman/rust-toolchain.toml. The
# OpenHuman graph needs 1.96+ (rusqlite 0.40 / libsqlite3-sys 0.38 use the
# `cfg_select!` macro), and one pin for both trees means a compiler release is
# a reviewed bump here rather than a surprise red CI. Bump the two together.
channel = "1.96.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
