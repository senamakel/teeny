description = "a night-shift episode, answering tonight's wire"
kind = "episode"
must_not = ['https?://', 'fridge rate', '\bnfa\b']
prompt = '''
Write tonight's episode: one thought, as narrative/EDITOR.md describes it, under the night-shift engine. The wire item in the inputs is why tonight happened.
'''

[inputs]
wire = {source = "news", text = "a major cloud provider had a six-hour outage; thousands of services went dark overnight"}
night = {hour_utc = 3, episode = 5}
