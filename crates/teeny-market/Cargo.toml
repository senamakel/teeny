[package]
name = "teeny-market"
description = "Market data (DexScreener, GeckoTerminal, GMGN, Solana, CoinGecko), technical analysis and the read-only market tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
# `float_roundtrip`: parse provider JSON to the nearest double, as JSON.parse
# does, so a price read here is bit-for-bit the price the TypeScript read.
serde_json = { workspace = true, features = ["float_roundtrip"] }
teeny-core.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# `test-util`: the limiter's gap is tested on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

[lints]
workspace = true
