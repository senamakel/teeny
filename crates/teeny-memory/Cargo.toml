[package]
name = "teeny-memory"
description = "The account's memory: the shared TinyMemory store every agent reads, the legacy CortexDB client it is imported from, and the recall_memory and remember tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
teeny-core.workspace = true
thiserror.workspace = true
# The TinyMemory contract the shared store speaks: items, hits, the engine.
tinymemory-api.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The in-memory reference engine, behind the contract's `conformance` feature.
tinymemory-api = { workspace = true, features = ["conformance"] }
wiremock.workspace = true

[lints]
workspace = true
