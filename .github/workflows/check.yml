# Lint, test and build on every pull request.
#
# - kernel: build teeny-kernel from the vendored OpenHuman (the same release
#   profile the image builds), then boot it through bin/kernel with a stub model
#   and run the whole live test: seeding, a shell job, bin/crons, bin/oh,
#   bin/ask, the keyring across a restart.
# - scripts: shellcheck over bin/ and the reconciliation tests, which need no
#   core.
# - web: the Next.js site.
#
# Nothing here deploys. There is no deploy-on-merge: the box runs
# deploy/compose.yaml by hand (deploy/README.md).

name: check

on:
  pull_request:
  workflow_call:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # OpenHuman and its nested vendors, all public over https.
      - name: Fetch vendor/openhuman
        run: git submodule update --init --recursive --depth 1 --jobs 8 vendor/openhuman
      # OpenHuman links X11, xdo, evdev and ALSA on Linux.
      - name: Install system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libasound2-dev libxdo-dev libxtst-dev \
            libx11-dev libxi-dev libevdev-dev libudev-dev sqlite3
      # Keep in step with rust-toolchain.toml (vendor/openhuman's).
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p teeny-kernel
      - run: bin/test/kernel_live_test.sh
        env:
          OPENHUMAN_CORE_BIN: target/release/teeny-kernel

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck ships on the runner image.
      - run: shellcheck -x bin/oh bin/ask bin/crons bin/heartbeat bin/kernel bin/seed-cron bin/lib/*.sh bin/test/*.sh deploy/*.sh
      - run: bin/test/seed_cron_test.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
