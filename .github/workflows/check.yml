# Lint, typecheck, test and build, on every pull request and as the gate in
# front of every deploy.
#
# One definition, two callers: pull requests run it directly, and deploy.yml
# calls it as a reusable workflow so main is checked by exactly the steps a PR
# was. Before this, the checks lived inside deploy.yml and ran only on push to
# main, so a PR whose tests did not typecheck merged green and turned the
# deploy red afterwards -- five times in one morning.
#
# `npm run typecheck` is `tsc -p tsconfig.test.json`, which covers the tests;
# `npm run build` is the production tsconfig, which is what the container
# compiles. Both run, because either alone has let the other's errors through.

name: check

on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
