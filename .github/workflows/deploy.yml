# Ship main to the box on every push.
#
# The same ./deploy/deploy.sh a person runs, in --keep-env mode: the two .env
# files are secrets that already live on the box, and a deploy from here
# changes the code and nothing else. The only secret this workflow holds is
# a dedicated SSH key (DEPLOY_SSH_KEY) authorised for droid@robot1; the host
# key is pinned in deploy/known_hosts so a changed fingerprint fails the run
# instead of prompting.
#
# Deploys queue rather than overlap: two pushes a minute apart produce two
# deploys in order, never one racing the other for the containers.
#
# The checks in front of the deploy are check.yml, the workflow pull requests
# run, called here as a reusable workflow rather than copied: the legacy
# TypeScript service, the Rust workspace (fmt, clippy, test, the duplicate-
# crate tripwire), the web build, and the deploy scripts.
#
# deploy.sh refuses to replace a running legacy bot with the Rust one, so a
# push here never performs the cutover by accident; that is cutover.sh's,
# run by a person (deploy/README.md, "Moving to the Rust bot").

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The same checks a pull request runs, from check.yml, so what gates the
  # deploy is exactly what gated the merge.
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      # With the submodules: brain/sync is the brain-sync sidecar's build
      # context, rsynced from here to the box, and a bare checkout leaves it
      # an empty directory, which the build refuses as a missing context.
      # vendor/openhuman has to come recursively: the bot image builds on the
      # box from the rsynced tree, and both the cargo [patch] tables and the
      # TinyComputer module point into its nested vendors.
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Fetch vendor/openhuman's nested submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8 vendor/openhuman
      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp deploy/known_hosts ~/.ssh/known_hosts
      - name: Deploy
        run: DEPLOY_KEY="$HOME/.ssh/deploy_key" ./deploy/deploy.sh --skip-checks --keep-env
      - name: Recent logs on failure
        if: failure()
        run: |
          ssh -o BatchMode=yes -i "$HOME/.ssh/deploy_key" droid@174.138.35.76 \
            'docker compose --project-directory /home/droid/teeny/deploy -f /home/droid/teeny/deploy/compose.prod.yaml --env-file /home/droid/teeny/deploy/.env logs --tail 80 bot web' || true
