# Teeny, in Rust, on the OpenHuman embedded harness.
#
# A virtual workspace: every crate lives under `crates/`. OpenHuman is the git
# submodule at `vendor/openhuman`; only `teeny-agent` and the `teeny` binary
# depend on it. The TypeScript service it replaces lives in `legacy/` until
# cutover, `web/` is the Next.js site, and `brain/` is a content submodule;
# none of them are Cargo packages, and neither is anything under `vendor/`.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor", "legacy", "web", "worktrees", "brain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/teeny"
publish = false

[workspace.dependencies]
# --- our crates -------------------------------------------------------------
teeny-core = { path = "crates/teeny-core" }
teeny-store = { path = "crates/teeny-store" }
teeny-x = { path = "crates/teeny-x" }
teeny-memory = { path = "crates/teeny-memory" }
teeny-market = { path = "crates/teeny-market" }
teeny-media = { path = "crates/teeny-media" }
teeny-safety = { path = "crates/teeny-safety" }
teeny-cadence = { path = "crates/teeny-cadence" }
teeny-agent = { path = "crates/teeny-agent" }
teeny-jobs = { path = "crates/teeny-jobs" }

# --- OpenHuman ----------------------------------------------------------------
# The trimmed build: no shell, fs-write, exec, system, composio, web3,
# runtime-node, voice, mcp or flows. Only `skills` and `modules` (the
# tinycomputer browser loads as a module). See the plan's threat model.
openhuman-core = { path = "vendor/openhuman/crates/openhuman-core", package = "openhuman", default-features = false, features = ["skills", "modules"] }
openhuman-embed = { path = "vendor/openhuman/crates/openhuman-embed", default-features = false, features = ["skills", "modules"] }

# --- shared third-party crates (versions as in vendor/openhuman/Cargo.lock) ---
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
cron = "0.17.0"
futures = "0.3.34"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
percent-encoding = "2.3.2"
proptest = "1.11.0"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
resvg = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.7"
sha2 = "0.10.9"
thiserror = "2.0.20"
tiny-skia = "0.11"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6.11", features = ["trace", "cors", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
usvg = "0.45"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# --- [patch] tables -----------------------------------------------------------
#
# `[patch]` is only honoured at the workspace root, and OpenHuman's own tables
# are ignored when it is a path dependency, so they are replicated here with
# every path rebased onto `vendor/openhuman/`. They mirror
# vendor/openhuman/Cargo.toml one for one; the downstream pattern is
# OpenCompany's root Cargo.toml.
#
# Why they matter: vendored crates name tinytools and tinyinference by git rev
# (and some by registry version). Without the redirects cargo resolves a second
# copy beside the path copy OpenHuman links, and `tinytools::Tool` or
# `ChatModel` from each is a different type. scripts/check-dup-crates.sh is the
# tripwire. A patch path is resolved eagerly whatever the feature set, so a
# stale entry fails `cargo metadata` outright: re-check these on every
# vendor/openhuman bump.
[patch."https://github.com/tinyhumansai/tinytools"]
tinytools = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-agent = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }

[patch."https://github.com/tinyhumansai/tinyinference"]
tinyinference-core = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }

[patch.crates-io]
# The six tinyinference crates by registry name as well: tinyagents-harness
# names them with `version = "0.3.0"` beside the path, and any crate reaching
# them by version alone must land on the same vendored copy.
tinyinference-core = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }
# `tinychannels` is reachable through teeny's optional `openhuman-telegram`
# feature (OpenHuman's channels), so it is in the lock and patched here even
# though the default build leaves it out. OpenHuman also patches `tinyflows`;
# it is not in the graph (`flows` is off), and an unused patch warns on every
# cargo command, so it is left out until a feature pulls it in:
#   tinyflows = { path = "vendor/openhuman/vendor/tinyflows/crates/tinyflows" }
tinychannels = { path = "vendor/openhuman/vendor/tinychannels" }

# --- profiles (OpenHuman's, so the vendored graph builds the same way) --------
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.dev.package."*"]
debug = false
