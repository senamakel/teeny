# The shadow run: layered over compose.prod.yaml by `deploy.sh --shadow`,
# together with `--profile legacy`.
#
#   legacy-bot   live on the account, on bot-data, as it always was
#   bot          the Rust bot, drafting and never posting, on its own volume
#                and its own copy of the mention queue
#
# Put the legacy service on the webhook's port for the duration, in
# deploy/.env: BOT_PORT=3111 and LEGACY_BOT_PORT=3110 (nginx proxies X's
# deliveries to 127.0.0.1:3110). deploy/README.md, "Moving to the Rust bot",
# has the whole procedure, including how to diff the drafts.
services:
  bot:
    environment:
      # Both gates shut: the drafts are logged, nothing is published, nothing
      # is sent on Telegram.
      DRY_RUN: "true"
      TELEGRAM_DRY_RUN: "true"
      # Telegram allows one getUpdates poller per token and X one activity
      # stream per app; legacy holds both while it is live.
      TELEGRAM_BOT_TOKEN: ""
      ACTIVITY_STREAM_ENABLED: "false"
      # Its own queue. The reply worker marks what it has handled; on the
      # live database that would hide mentions from the legacy service.
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-teeny}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}@mongo:27017/${SHADOW_MONGO_DATABASE:-teeny_shadow}?authSource=admin
      MONGO_DATABASE: ${SHADOW_MONGO_DATABASE:-teeny_shadow}
      # Its own memory root in teeny-cortexdb: the shadow's dry-run captures
      # and its agents' turns stay out of the root the live bot will use.
      # Import into it before the shadow run (deploy/README.md).
      TEENY_MEMORY_ROOT: ${SHADOW_MEMORY_ROOT:-team:teeny-shadow}
    volumes:
      # Same target as compose.prod.yaml's bot-data:/data, so it replaces it:
      # the live volume stays legacy's alone.
      - bot-shadow-data:/data

volumes:
  bot-shadow-data:
