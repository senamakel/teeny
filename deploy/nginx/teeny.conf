# Front-proxy vhost for teeny. OPTIONAL: the stack runs without it, on the
# cron poller alone. This file is only needed for the two HTTP surfaces --
# X's Account Activity webhook and the ad-hoc agent endpoint -- both of which
# X and you reach from the public internet.
#
# nginx runs on the host. Installed as /etc/nginx/sites-available/teeny.conf
# and symlinked into sites-enabled.
#
# The domain is proxied by Cloudflare, which connects to this origin over
# HTTPS. The 443 block is therefore not optional: without a TLS server for
# this name, nginx falls through to the first one it has -- another project's
# -- and Cloudflare serves that site under this domain.
#
# Issuing the certificate is a chicken-and-egg: this file will not load until
# /etc/letsencrypt/live/teeny.tinyhumans.ai exists, and certbot cannot answer
# the challenge until nginx serves the name. Install the port 80 block alone
# first, issue, then install the whole file.
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d teeny.tinyhumans.ai
#   sudo nginx -t && sudo systemctl reload nginx

upstream teeny_bot {
    server 127.0.0.1:3110;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name teeny.tinyhumans.ai;

    # Kept open on both ports: Let's Encrypt reaches this origin through
    # Cloudflare, which forwards the challenge over whichever port its SSL
    # mode dictates rather than the one the ACME client dialled.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teeny.tinyhumans.ai;

    ssl_certificate     /etc/letsencrypt/live/teeny.tinyhumans.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teeny.tinyhumans.ai/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # X's Account Activity webhook. Signed by X and verified in the app; X
    # retries a delivery it does not see acknowledged quickly, so nothing here
    # may buffer or slow the response down.
    location /webhooks/x {
        proxy_pass http://teeny_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ad-hoc agent tasks. Bearer-authenticated in the app (AGENT_API_TOKEN),
    # and a single turn can research for a while, so the timeout is generous.
    location /agent/run {
        proxy_pass http://teeny_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # /health and /queue are operational, not public. Read them over the SSH
    # tunnel on 127.0.0.1:3110 instead of publishing the backlog.
    location / {
        return 404;
    }
}
