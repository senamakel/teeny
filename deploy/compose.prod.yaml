# Production stack for teeny.
#
# Every published port binds to 127.0.0.1 on purpose. The droplet already runs
# other projects and one host nginx owns :80 and :443, so nothing here may take
# a public port; the front proxy reaches the webhook over loopback.
#
# The stack: the agent in one container -- X ingest, the webhook, the reply
# worker, the scheduled posts, Telegram and /agent/run, one Rust process on
# the OpenHuman harness -- over a Mongo mention cache, plus the landing page.
# Its memory is `teeny-cortexdb`, a CortexDB of its own that every agent shares
# through OpenHuman's TinyMemory. The legacy service's memory, the shared
# CortexDB, lives outside this file (`teeny memory import` copies it across),
# and the ladder is a container this project does not own. Neither is on this network:
# both publish on the host's docker0 address (172.17.0.1, what compose calls
# `host-gateway`), and `extra_hosts` below pins `ladder` and `cortexdb` to it,
# so the names resolve from /etc/hosts and survive either container being
# recreated. They used to be reached by `docker network connect`, which is
# runtime state: `ladder-up --pull` recreated the ladder on 2026-09-15 and
# the new container was not on the network, `getaddrinfo EAI_AGAIN ladder`
# failed every morning post and the chart for three days, and nothing else
# looked wrong (2026-09-18).

name: teeny

services:
  # The whole agent: the Rust `teeny` binary on the OpenHuman harness, built
  # from the root Dockerfile. One process reads X and fills the mention
  # cache, serves the webhook and /agent/run, drains the cache into replies,
  # runs the scheduled posts, and answers on Telegram. The chart cron and the
  # Telegram poller must each run in exactly one place, so never run two
  # copies of this, and never run it live beside `legacy-bot` (below): two
  # agents on one account means two answers to one mention, in public.
  #
  # The container is locked down: a read-only root, a tmpfs /tmp, no
  # capabilities but the four the entrypoint spends before it drops to uid
  # 10001 (CHOWN, DAC_OVERRIDE, SETUID, SETGID; docker/entrypoint.sh says
  # why), and no-new-privileges, so teeny and Chromium hold none of them.
  # Everything it writes is on the volume, laid out as /data/{openhuman,
  # chrome-profile, media, articles, state}; the entrypoint copies the
  # legacy service's flat files into that layout on first boot and leaves
  # the originals for a rollback.
  bot:
    image: teeny:current
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # raw: compose would otherwise interpolate the values, and
      # CHART_COMMUNITY_QUERY="$TINY -is:retweet" loses its ticker.
      - path: ../.env
        format: raw
    # These win over ../.env, which carries the same keys pointed at whatever
    # the developer runs locally. On the droplet everything is reached by
    # name -- this stack's services over the compose network, the two shared
    # containers through extra_hosts -- and none is published where a browser
    # could get to it.
    environment:
      # The shared memory every agent reads and writes: this stack's own
      # CortexDB, over the compose network. OpenHuman's engine refuses
      # cleartext to anything but loopback, so the bot relays to it from
      # 127.0.0.1 inside its own container (teeny-agent memory_relay.rs).
      TEENY_MEMORY_URL: http://teeny-cortexdb:3141
      TEENY_MEMORY_TOKEN: ${TEENY_CORTEX_API_KEY:?set TEENY_CORTEX_API_KEY in deploy/.env}
      # The legacy store: only `teeny memory import` reads it.
      CORTEX_API_URL: http://cortexdb:3141
      LLM_BASE_URL: ${LADDER_URL:-http://ladder:6969/v1}
      LLM_API_KEY: ${LADDER_API_KEY:?set LADDER_API_KEY in deploy/.env}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-teeny}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-teeny}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-teeny}
      # The brain's checkout, read-only: the agents' token spend is folded
      # into the ledger from it, and /brain serves the roster and the runs.
      BRAIN_DATA_DIR: /brain
      # The volume layout. ../.env still carries the legacy service's
      # relative data/ paths, which would land on the read-only root here.
      TEENY_DATA: /data
      OPENHUMAN_WORKSPACE: /data/openhuman
      MEDIA_OUTPUT_DIR: /data/media
      REFERENCE_SHEET_PATH: /data/media/reference-sheet.json
      CHART_OUTPUT_DIR: /data/media/charts
      MOON_OUTPUT_DIR: /data/media/moon
      NARRATIVE_LIKENESS_DIR: /data/media/likeness
      ARTICLES_DIR: /data/articles
      QUOTE_LOG_PATH: /data/state/quotes.json
      NARRATIVE_STATE_PATH: /data/state/narrative-state.json
      BACKROOMS_DIR: /data/state/backrooms
      LEARNINGS_PATH: /data/state/memory/LEARNINGS.md
    # api.telegram.org publishes an AAAA record and this network has no v6
    # route; a client that tries v6 first sits in a connect timeout instead
    # of falling back. The legacy service needed
    # NODE_OPTIONS=--dns-result-order=ipv4first for it (2026-09-14). With no
    # v6 inside the container there is nothing to try first.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    extra_hosts:
      - "${LADDER:-ladder}:host-gateway"
      - "cortexdb:host-gateway"
    ports:
      - "127.0.0.1:${BOT_PORT:-3110}:3001"
    volumes:
      - bot-data:/data
      - ${BRAIN_DIR:?set BRAIN_DIR in deploy/.env}:/brain:ro
    # Chromium keeps its renderer memory in /dev/shm; Docker's 64 MB default
    # crashes tabs.
    shm_size: 1gb
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongo:
        condition: service_healthy
      # Started, not healthy: the bot boots without its memory and says so
      # (MEMORY WAS UNAVAILABLE in a turn, the hourly health line), rather
      # than sitting in Created while the store warms up.
      teeny-cortexdb:
        condition: service_started
    healthcheck:
      test: ["CMD", "teeny", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The TypeScript service the Rust bot replaces, built from legacy/ with the
  # repo root as context. Behind the `legacy` profile, so a plain `up` never
  # starts it. It is here for two things only:
  #
  # - the shadow run (deploy/README.md, "Moving to the Rust bot"): this one
  #   live on the account, the Rust bot beside it in dry-run on its own
  #   volume (compose.shadow.yaml);
  # - the rollback after cutover: `./deploy/cutover.sh --undo` stops the Rust
  #   bot and starts this on the bot port, over the flat files the Rust
  #   entrypoint copied from and never removed.
  #
  # Same volume, at the path legacy has always used. Never `up` this beside a
  # live (DRY_RUN=false) `bot`.
  legacy-bot:
    profiles: [legacy]
    image: teeny-legacy:current
    build:
      context: ..
      dockerfile: legacy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        format: raw
    environment:
      CORTEX_API_URL: http://cortexdb:3141
      LLM_BASE_URL: ${LADDER_URL:-http://ladder:6969/v1}
      LLM_API_KEY: ${LADDER_API_KEY:?set LADDER_API_KEY in deploy/.env}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-teeny}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-teeny}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-teeny}
      # Node's fetch tried api.telegram.org's v6 address first and never fell
      # back (2026-09-14).
      NODE_OPTIONS: --dns-result-order=ipv4first
      BRAIN_DATA_DIR: /brain
    extra_hosts:
      - "${LADDER:-ladder}:host-gateway"
      - "cortexdb:host-gateway"
    ports:
      - "127.0.0.1:${LEGACY_BOT_PORT:-3111}:3001"
    volumes:
      - bot-data:/app/data
      - ${BRAIN_DIR:?set BRAIN_DIR in deploy/.env}:/brain:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The landing page at teeny.enamakel.com: Teeny's mind, turned inside out.
  # Its own image from ./web, nothing shared with the agent, and the host nginx
  # vhost in deploy/nginx/teeny.enamakel.com.conf is what puts it on the
  # internet. MIND_API_URL is the bot, which serves the journal at /mind,
  # the inference ledger at /ledger and the brain at /brain; unset, the page
  # shows labelled samples.
  web:
    image: teeny-web:current
    build:
      context: ../web
    restart: unless-stopped
    environment:
      # The bot's ingest container serves the feeds; both sit on teeny_default.
      MIND_API_URL: ${MIND_API_URL:-http://bot:3001}
      # The brain's public repository, for the commits shown on /brain.
      BRAIN_REPO: ${BRAIN_REPO:-teenydroid/brain}
    ports:
      - "127.0.0.1:${WEB_PORT:-3120}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Teeny's brain: the OpenCompany host over the public brain checkout. The
  # checkout at BRAIN_DIR IS the host's data root -- definition, ledgers,
  # notes and runtime record in one git working tree -- and it lives outside
  # the rsynced source tree because deploy.sh's --delete would wipe live
  # state. It is cloned once by deploy.sh and owned by brain-sync after that.
  #
  # Inference goes to the same ladder as everything else on this box, injected
  # from the environment; nothing in the checkout holds a credential. The
  # console is served by the host at / and published on loopback only: reach
  # it over `ssh -L 3130:127.0.0.1:3130`. Sign-in is email mode with the
  # first password minted offline (deploy/README.md, "The brain").
  #
  # The entrypoint is ours, not the image's: it restarts the server when
  # /data/.reload-requested appears, which is how the curator agent (and
  # brain-sync, after a pull) get an edited definition loaded without a
  # docker socket anywhere. The image is pulled, never built here.
  opencompany:
    image: ${OPENCOMPANY_IMAGE:?set OPENCOMPANY_IMAGE in deploy/.env}
    restart: unless-stopped
    init: true
    # The box user, so files the host writes are the checkout owner's and
    # brain-sync can commit them.
    user: "${BRAIN_UID:-1000}:${BRAIN_GID:-1000}"
    entrypoint: ["/bin/sh", "/opt/brain/entrypoint.sh"]
    environment:
      OPENCOMPANY_DATA_DIR: /data
      OPENCOMPANY_BIND: 0.0.0.0:8080
      OPENCOMPANY_CONSOLE_DIR: /app/console
      OPENCOMPANY_DEPLOYMENT: self-hosted
      OPENCOMPANY_INFERENCE_URL: ${LADDER_URL:-http://ladder:6969/v1}
      OPENCOMPANY_INFERENCE_KEY: ${LADDER_API_KEY:?set LADDER_API_KEY in deploy/.env}
      # The standing admin grant; the public manifest names nobody.
      OPENCOMPANY_ADMIN_EMAIL: ${BRAIN_ADMIN_EMAIL:?set BRAIN_ADMIN_EMAIL in deploy/.env}
      # A non-passwd uid has no home; git, ssh and the runtime all want one.
      HOME: /tmp
    extra_hosts:
      - "${LADDER:-ladder}:host-gateway"
    volumes:
      - ${BRAIN_DIR:?set BRAIN_DIR in deploy/.env}:/data
      - ./opencompany/entrypoint.sh:/opt/brain/entrypoint.sh:ro
    ports:
      - "127.0.0.1:${BRAIN_PORT:-3130}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Commits the brain after every run and pushes it to GitHub. Same checkout,
  # same uid; the teenydroid account's SSH key (BRAIN_SSH_KEY, minted on the
  # box by deploy.sh) mounted read-only. Both .env files are mounted only so their
  # VALUES can be grepped out of every commit -- the second gate behind
  # gitleaks, because the ladder key has no shape a scanner would recognise.
  #
  # The image is defined in the brain repository (brain/sync) and built from
  # the submodule pinned in THIS repository -- not from the live checkout at
  # BRAIN_DIR, which the agents can write to. A change to the sync loop or its
  # gates therefore lands through a reviewed gitlink bump, never from inside
  # the running brain.
  brain-sync:
    image: teeny-brain-sync:current
    build:
      context: ../brain/sync
      args:
        SYNC_UID: ${BRAIN_UID:-1000}
        SYNC_GID: ${BRAIN_GID:-1000}
    restart: unless-stopped
    init: true
    user: "${BRAIN_UID:-1000}:${BRAIN_GID:-1000}"
    environment:
      BRAIN_DIR: /data
      BRAIN_SYNC_INTERVAL: ${BRAIN_SYNC_INTERVAL:-60}
      BRAIN_REMOTE: ${BRAIN_REMOTE:-git@github.com:teenydroid/brain.git}
      BRAIN_BRANCH: ${BRAIN_BRANCH:-main}
      GIT_AUTHOR_NAME: Teeny
      GIT_AUTHOR_EMAIL: tiny@tinyhumans.ai
      HOME: /tmp
    volumes:
      - ${BRAIN_DIR:?set BRAIN_DIR in deploy/.env}:/data
      - ${BRAIN_SSH_KEY:?set BRAIN_SSH_KEY in deploy/.env}:/run/secrets/brain_key:ro
      - ./.env:/run/secrets/deploy.env:ro
      - ../.env:/run/secrets/bot.env:ro
    depends_on:
      opencompany:
        condition: service_started

  # The Rust bot's memory: a CortexDB of its own, the one store every Teeny
  # agent shares through OpenHuman's TinyMemory (deploy/README.md, "The
  # shared memory"). Not the legacy store: that is the shared `cortex`
  # container (below, and outside this file), which `teeny memory import`
  # reads from. Mirrors `cortexdb` below, less the document pipeline (nothing
  # here ingests files, so no tika), always up, and on this stack's network
  # only: the bot reaches it by name, and the loopback port is for an
  # operator on the box.
  teeny-cortexdb:
    image: ${TEENY_CORTEX_IMAGE:-cortexdb/cortexdb:latest}
    restart: unless-stopped
    environment:
      CORTEX_DEPLOYMENT_PRESET: on_prem_enterprise
      CORTEX_API_KEY: ${TEENY_CORTEX_API_KEY:?set TEENY_CORTEX_API_KEY in deploy/.env}
      CORTEX_BIND_ALL: "1"
      CORTEX_V1_MINTER_ENABLE: "1"
      CORTEX_V1_LAYERS_AUTO: "1"

      CORTEX_LLM_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:-flash}
      OPENAI_API_KEY: ${LADDER_API_KEY}
      LLM_API_KEY: ${LADDER_API_KEY}

      # Pinned on first ingest and irreversible after it. robot1 has no
      # Venice key, so the fleet's `vectors` tier (BGE-M3) does not embed
      # there; `vectors-oai3` (Surplus) is what the shared store was moved to
      # on 2026-10-05. Check the dimension against the tier before the first
      # import: changing either later orphans the corpus.
      CORTEX_EMBEDDING_PROVIDER: ""
      CORTEX_EMBEDDING_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_EMBEDDING_MODEL: ${TEENY_CORTEX_EMBEDDING_MODEL:-vectors-oai3}
      CORTEX_EMBEDDING_DIMS: ${TEENY_CORTEX_EMBEDDING_DIMS:-3072}

      CORTEX_ENRICHMENT_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_ENRICHMENT_MODEL: ${CORTEX_ENRICHMENT_MODEL:-flash}
      CORTEX_ENRICHMENT_API_KEY: ${LADDER_API_KEY}
      CORTEX_ENRICHMENT_CONCURRENCY: "2"
      CORTEX_ENRICHMENT_DELAY_SECONDS: "60"

      CORTEX_ANSWER_PROVIDER: openai
      CORTEX_ANSWER_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_ANSWER_MODEL: ${CORTEX_ANSWER_MODEL:-reasoning}
      CORTEX_ANSWER_API_KEY: ${LADDER_API_KEY}
      CORTEX_ANSWER_MAX_TOKENS: "1500"
      CORTEX_VERIFIER_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_VERIFIER_MODEL: ${CORTEX_VERIFIER_MODEL:-reasoning}
      CORTEX_VERIFIER_API_KEY: ${LADDER_API_KEY}

      CORTEX_ENTITY_GRAPH: "1"
      CORTEX_ENTITY_GROUNDING: "1"
      CORTEX_FACT_JOIN_MULTIHOP: "1"
      CORTEX_BITEMPORAL_MODE: enforce
      CORTEX_HYBRID_RERANK: "1"
    extra_hosts:
      - "${LADDER:-ladder}:host-gateway"
    volumes:
      - teeny-cortexdb-data:/data
    ports:
      - "127.0.0.1:${TEENY_CORTEX_PORT:-3143}:3141"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3141/v1/admin/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Long-term memory. Every model call it makes goes to the same ladder the
  # agent uses, so there is one egress path and one set of provider keys on the
  # box rather than a second copy living inside a database.
  #
  # Behind a profile because on the box today CortexDB is NOT this stack's: it
  # is the shared `cortex` container, reached as `cortexdb` through the bot's
  # extra_hosts (deploy/README.md, "The memory tier is external"). A plain `up`
  # must not try to create a second one -- it did once, the port was taken,
  # and the agent sat in Created until somebody noticed. `--profile memory`
  # brings these up on a box that has no CortexDB of its own.
  cortexdb:
    profiles: [memory]
    image: cortexdb/cortexdb:latest
    restart: unless-stopped
    environment:
      CORTEX_DEPLOYMENT_PRESET: on_prem_enterprise
      CORTEX_API_KEY: ${CORTEX_API_KEY:?set CORTEX_API_KEY in deploy/.env}
      CORTEX_BIND_ALL: "1"
      CORTEX_V1_MINTER_ENABLE: "1"
      CORTEX_V1_LAYERS_AUTO: "1"

      CORTEX_LLM_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:-flash}
      OPENAI_API_KEY: ${LADDER_API_KEY}
      LLM_API_KEY: ${LADDER_API_KEY}

      # Pinned on first ingest and irreversible after it. Only
      # {256,384,512,768,1024,1536,3072} are legal and the ladder's `vectors`
      # tier returns 3072, so changing either side later orphans the corpus.
      CORTEX_EMBEDDING_PROVIDER: ""
      CORTEX_EMBEDDING_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_EMBEDDING_MODEL: ${CORTEX_EMBEDDING_MODEL:-vectors}
      CORTEX_EMBEDDING_DIMS: ${CORTEX_EMBEDDING_DIMS:-3072}

      CORTEX_ENRICHMENT_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_ENRICHMENT_MODEL: ${CORTEX_ENRICHMENT_MODEL:-flash}
      CORTEX_ENRICHMENT_API_KEY: ${LADDER_API_KEY}
      CORTEX_ENRICHMENT_CONCURRENCY: "2"
      CORTEX_ENRICHMENT_DELAY_SECONDS: "60"

      CORTEX_ANSWER_PROVIDER: openai
      CORTEX_ANSWER_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_ANSWER_MODEL: ${CORTEX_ANSWER_MODEL:-reasoning}
      CORTEX_ANSWER_API_KEY: ${LADDER_API_KEY}
      CORTEX_ANSWER_MAX_TOKENS: "1500"
      CORTEX_VERIFIER_URL: ${LADDER_URL:-http://ladder:6969/v1}
      CORTEX_VERIFIER_MODEL: ${CORTEX_VERIFIER_MODEL:-reasoning}
      CORTEX_VERIFIER_API_KEY: ${LADDER_API_KEY}

      CORTEX_ENTITY_GRAPH: "1"
      CORTEX_ENTITY_GROUNDING: "1"
      CORTEX_FACT_JOIN_MULTIHOP: "1"
      CORTEX_BITEMPORAL_MODE: enforce
      CORTEX_HYBRID_RERANK: "1"

      CORTEX_ARTIFACT_PIPELINE: "1"
      CORTEX_ARTIFACT_WORKERS: "2"
      CORTEX_DOCUMENT_PROVIDER: tika
      CORTEX_DOCUMENT_API_URL: http://tika:9998
    extra_hosts:
      - "${LADDER:-ladder}:host-gateway"
    volumes:
      - cortexdb-data:/data
    # The bot resolves `cortexdb` to host-gateway (its extra_hosts above), so
    # this one has to answer there, the same way the shared container does.
    ports:
      - "127.0.0.1:${CORTEX_PORT:-3142}:3141"
      - "172.17.0.1:3141:3141"
    depends_on:
      tika:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3141/v1/admin/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Text extraction for anything CortexDB ingests that is not already text.
  tika:
    profiles: [memory]
    image: apache/tika:latest-full
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9998/tika || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo:
    # 8.0, matching what the stonks stack already runs on this box (kernel
    # 6.8). Do not copy the newer box's pin of 7.0 over: that one is on kernel
    # 7.0.0, where 8.x either refuses to start or segfaults in a loop.
    #
    # This database is NOT derived data: it is the mention queue, and X's
    # search only reaches back 7 days, so a dropped volume loses any mention
    # older than that for good. Migrate it, never recreate it.
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-teeny}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-teeny}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27020}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  # The agent's whole state. Laid out by docker/entrypoint.sh; never recreate
  # it (the ingest cursor, the browser logins and OpenHuman's sessions and
  # cron jobs.db live here).
  bot-data:
  cortexdb-data:
  # The shared memory every Teeny agent reads and writes (teeny-cortexdb).
  # Not derived data once the bot is live: it holds everything the account
  # remembered since the import. Migrate it, never recreate it.
  teeny-cortexdb-data:
